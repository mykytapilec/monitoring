
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: monitoring-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
      PING: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - docker-socket-proxy
      - node-exporter
      - application
      - docker-exporter
      - alertmanager
    labels:
      prometheus_scrape: "true"
      prometheus_job: "prometheus"
    healthcheck:
      test:
        - CMD
        - /bin/wget
        - -q
        - -O
        - /dev/null
        - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtool:
    image: prom/prometheus:v3.5.0
    profiles:
      - validation
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    entrypoint:
      - "/bin/promtool"
    command:
      - "check"
      - "config"
      - "/etc/prometheus/prometheus.yml"

  alertmanager-validator:
    image: prom/alertmanager:v0.28.1
    profiles:
      - validation
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint:
      - "/bin/amtool"
    command:
      - "check-config"
      - "/etc/alertmanager/alertmanager.yml"


  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs)$"
    labels:
      prometheus_scrape: "true"
      prometheus_job: "node-exporter"


  application:
    build:
      context: ./application
    container_name: monitoring-application
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
    ports:
      - "3001:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      prometheus_scrape: "true"
      prometheus_job: "application"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker-exporter:
    build:
      context: ./docker-exporter
    container_name: monitoring-docker-exporter
    restart: unless-stopped
    environment:
      PORT: "9101"
      DOCKER_API_URL: "http://docker-socket-proxy:2375"
    depends_on:
      - docker-socket-proxy
    labels:
      prometheus_scrape: "true"
      prometheus_job: "docker-exporter"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9101/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  loki:
    image: grafana/loki:3.5.0
    container_name: monitoring-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test:
        - CMD
        - /busybox/wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3100/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: monitoring-alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: alerts@monitoring.local
      GF_SMTP_FROM_NAME: Grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: monitoring-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - mailpit
    healthcheck:
      test:
        - CMD
        - /bin/wget
        - -q
        - -O
        - /dev/null
        - http://localhost:9093/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: monitoring-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
