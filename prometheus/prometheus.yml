
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/alert-rules.yml
  - /etc/prometheus/rules/recording-rules.yml

scrape_configs:
  - job_name: prometheus
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_prometheus_scrape
        action: keep
        regex: "true"
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        action: keep
        regex: prometheus
      - source_labels:
          - __meta_docker_port_private
        action: keep
        regex: "9090"

  - job_name: node-exporter
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_prometheus_scrape
        action: keep
        regex: "true"
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        action: keep
        regex: node-exporter
      - source_labels:
          - __meta_docker_port_private
        action: keep
        regex: "9100"

  - job_name: application
    metrics_path: /metrics
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_prometheus_scrape
        action: keep
        regex: "true"
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        action: keep
        regex: application
      - source_labels:
          - __meta_docker_port_private
        action: keep
        regex: "3001"

  - job_name: docker-exporter
    metrics_path: /metrics
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_prometheus_scrape
        action: keep
        regex: "true"
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        action: keep
        regex: docker-exporter
      - source_labels:
          - __meta_docker_port_private
        action: keep
        regex: "9101"
