global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alerts@monitoring.local"
  smtp_require_tls: false

route:
  receiver: "mailpit"
  group_by:
    - alertname
    - job
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: "mailpit-critical"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m

    - matchers:
        - severity="warning"
      receiver: "mailpit-warning"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

receivers:
  - name: "mailpit"
    email_configs:
      - to: "admin@monitoring.local"
        send_resolved: true

  - name: "mailpit-critical"
    email_configs:
      - to: "admin@monitoring.local"
        send_resolved: true

  - name: "mailpit-warning"
    email_configs:
      - to: "admin@monitoring.local"
        send_resolved: true
