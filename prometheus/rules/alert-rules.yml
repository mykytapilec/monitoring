
groups:
  - name: monitoring-alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target is down"
          description: "Target {{ $labels.job }} at {{ $labels.instance }} has been unavailable for more than 1 minute."

      - alert: HighCPUUsage
        expr: instance:node_cpu_usage:percent_rate5m > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage on {{ $labels.instance }} has exceeded 80% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: instance:node_memory_usage:percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage on {{ $labels.instance }} has exceeded 80% for more than 5 minutes."
